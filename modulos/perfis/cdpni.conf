# ============================================================================
# Perfil da unidade — CDPNI (Centro de Detenção Provisória de Nova Independência)
# ============================================================================
# Valores específicos desta unidade: DNS interno, servidor de hora e os
# domínios da intranet do governo. O módulo 00-base oferece este perfil na
# instalação; escolhê-lo evita digitar tudo à mão.
#
# Para outra unidade, copie este arquivo, troque os valores e use o nome novo:
#   cp modulos/perfis/cdpni.conf modulos/perfis/minha-unidade.conf
# ============================================================================

# Domínio dos nomes internos da LAN
DOMINIO_LOCAL="cdpni.local"

# ── Resolvers upstream ──────────────────────────────────────────────────────
# Ordem: DNS internos primeiro, públicos como reserva.
#
# Só entram aqui resolvers que resolvem TAMBÉM a internet.
#
# Verificado em campo:
#   10.14.8.16  intranet + internet   -> na lista
#   10.1.6.222  intranet + internet   -> na lista
#   10.14.8.20  SÓ intranet           -> FORA (ver ZONAS_INTERNAS abaixo)
#   1.1.1.1     bloqueado nesta rede  -> FORA
#
# O 10.14.8.20 fora daqui não é perda: ele continua respondendo por
# policiapenal.sp.gov.br pela zona fixada, que é determinística.
#
# Por que isso importa: o BIND só tenta o próximo resolver em timeout ou
# SERVFAIL. NXDOMAIN é resposta válida e encerra a busca — um resolver que
# nega domínios externos derruba a internet da rede inteira, e ainda por
# cima costuma ser o mais rápido por ser local.
#
# Depois de instalar: bash modulos/20-dns-bind9/verificar.sh
DNS_FORWARDERS="10.14.8.16 10.1.6.222 8.8.8.8 8.8.4.4"

# ── Domínios da intranet do governo ─────────────────────────────────────────
# Formato: dominio:ip[,ip] separados por espaço.
# Cada um vira uma zona de encaminhamento fixa — determinística, sem depender
# de qual resolver da lista acima respondeu mais rápido.
ZONAS_INTERNAS="cartoriosap.sp.gov.br:10.1.6.222 policiapenal.sp.gov.br:10.14.8.20 prodesp.sp.gov.br:10.1.6.222"

# ── Hora ────────────────────────────────────────────────────────────────────
# Servidor de hora institucional (GPU). O pool público fica como reserva,
# para o relógio não derivar se o interno cair.
NTP_SERVIDORES="10.14.8.20"
NTP_POOL="pool.ntp.br"
