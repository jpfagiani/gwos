# ============================================================
# GWOS — Squid Proxy com SSL Bump (módulo 50-proxy-squid)
# /etc/squid/squid.conf
# ============================================================
# Os arquivos incluídos daqui são gerados por outras peças do GWOS:
#   gwos_redes.conf       → gwos-integrar (redes de /etc/gwos/gwos.conf)
#   gwos_integracao.conf  → gwos-integrar (resolver DNS)
#   gwos_ips_*.txt        → painel / scripts/aplicar_nftables.sh
#   gwos_*list.txt        → painel / scripts/gerar_squid_dominios.sh
#   gwos_horarios.conf    → painel / scripts/gerar_squid_acl.sh
#   gwos_tcp_outgoing.conf→ painel (NAT 1:1)
# Sem o painel, todos existem vazios e o proxy funciona igual.
# ============================================================

# ------------------------------------------------------------
# Portas de escuta — geradas por gwos-integrar
# ------------------------------------------------------------
# Vêm de SQUID_PORTA_FWD / SQUID_PORTA / SQUID_PORTA_SSL em
# /etc/gwos/gwos.conf, as mesmas que o firewall usa no redirecionamento.
# Ficam num arquivo gerado para que mudar a porta não exija editar dois
# lugares e correr o risco de o nftables redirecionar para porta morta.
#
#   3127  forward-proxy explícito
#   3128  HTTP transparente (interceptado pelo nftables)
#   3129  HTTPS transparente com SSL Bump (só se houver certgen e CA)
include /etc/squid/conf.d/gwos_portas.conf

# ------------------------------------------------------------
# SSL Bump — peek SNI → splice sites livres/whitelist → bump resto
# ------------------------------------------------------------
acl step1 at_step SslBump1

acl gwos_ips_livres_src    src "/etc/squid/conf.d/gwos_ips_livres.txt"
acl gwos_liberados_src     src "/etc/squid/conf.d/gwos_ips_liberados.txt"
acl gwos_whitelist_sni     ssl::server_name "/etc/squid/conf.d/gwos_whitelist.txt"
acl gwos_sites_livres_sni  ssl::server_name "/etc/squid/conf.d/gwos_sites_livres.txt"
acl gwos_blacklist_sni     ssl::server_name "/etc/squid/conf.d/gwos_blacklist.txt"

ssl_bump peek step1
ssl_bump splice gwos_ips_livres_src
ssl_bump splice gwos_liberados_src
ssl_bump splice gwos_whitelist_sni
ssl_bump splice gwos_sites_livres_sni
ssl_bump bump all

# ------------------------------------------------------------
# ACLs de rede
# ------------------------------------------------------------
# Faixas privadas padrão
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

acl rede_interna dst 10.0.0.0/8
acl rede_interna dst 172.16.0.0/12
acl rede_interna dst 192.168.0.0/16

# Redes reais deste gateway — gerado por gwos-integrar a partir de
# /etc/gwos/gwos.conf. Cobre faixas FORA do RFC 1918 (ex.: 172.14.29.0/24)
# e a rede secundária, sem precisar editar este arquivo.
include /etc/squid/conf.d/gwos_redes.conf

acl SSL_ports  port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 21
acl Safe_ports port 70
acl Safe_ports port 210
acl Safe_ports port 280
acl Safe_ports port 488
acl Safe_ports port 591
acl Safe_ports port 777
acl Safe_ports port 1025-65535

acl CONNECT method CONNECT

# ------------------------------------------------------------
# Grupos de IPs gerenciados pelo GWOS
# ------------------------------------------------------------
acl gwos_bloqueados src "/etc/squid/conf.d/gwos_ips_bloqueados.txt"
acl gwos_parciais   src "/etc/squid/conf.d/gwos_ips_parciais.txt"
acl gwos_liberados  src "/etc/squid/conf.d/gwos_ips_liberados.txt"

# ------------------------------------------------------------
# Domínios gerenciados pelo GWOS
# ------------------------------------------------------------
acl gwos_whitelist_dst    dstdomain "/etc/squid/conf.d/gwos_whitelist.txt"
acl gwos_sites_livres_dst dstdomain "/etc/squid/conf.d/gwos_sites_livres.txt"
acl gwos_blacklist_dst    dstdomain "/etc/squid/conf.d/gwos_blacklist.txt"

# ------------------------------------------------------------
# Regras de acesso — ORDEM IMPORTA
# ------------------------------------------------------------
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow localhost manager
http_access deny manager

# ------------------------------------------------------------
# 1. Destinos internos (LAN→LAN): permite acesso ao gateway/painel
#    e a outros IPs da rede interna sem passar pelo proxy de conteúdo
# ------------------------------------------------------------
http_access allow localhost
http_access allow localnet rede_interna

# ------------------------------------------------------------
# 2. Whitelist (governo, obrigatórios): qualquer IP da LAN acessa
#    mesmo sem estar em nenhum grupo
# ------------------------------------------------------------
http_access allow localnet gwos_whitelist_dst
http_access allow localnet gwos_whitelist_sni
http_access allow localnet gwos_sites_livres_dst
http_access allow localnet gwos_sites_livres_sni

# ------------------------------------------------------------
# 3. IPs liberados: acesso total à internet
# ------------------------------------------------------------
http_access allow gwos_liberados

# ------------------------------------------------------------
# 4. IPs bloqueados: apenas whitelist (já permitida acima)
# ------------------------------------------------------------
http_access deny gwos_bloqueados

# ------------------------------------------------------------
# 5. IPs parciais: internet com restrições de blacklist e horário
# ------------------------------------------------------------
include /etc/squid/conf.d/gwos_horarios.conf

http_access deny gwos_parciais gwos_blacklist_dst
http_access deny gwos_parciais gwos_blacklist_sni
http_access allow gwos_parciais

# ------------------------------------------------------------
# 6. IPs sem grupo: apenas whitelist (já permitida no passo 2).
#    Todo o resto é negado.
#
#    ATENÇÃO: sem o painel (módulo 60) as listas de grupos ficam
#    vazias e NINGUÉM navega. Para usar o Squid isolado, troque a
#    linha abaixo por 'http_access allow localnet'.
# ------------------------------------------------------------
http_access deny all

# ------------------------------------------------------------
# NAT 1:1 — tcp_outgoing_address por cliente (gerado por aplicar_nftables.sh)
# ------------------------------------------------------------
include /etc/squid/conf.d/gwos_tcp_outgoing.conf

# ------------------------------------------------------------
# Cache
# ------------------------------------------------------------
cache_mem 256 MB
maximum_object_size_in_memory 512 KB
maximum_object_size 64 MB
cache_dir ufs /var/spool/squid 4096 16 256
cache_replacement_policy heap LFUDA
memory_replacement_policy heap GDSF

no_cache deny CONNECT

# ------------------------------------------------------------
# Logs
# ------------------------------------------------------------
logformat gwos %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt

access_log /var/log/squid/access.log gwos
cache_log  /var/log/squid/cache.log
cache_store_log none
logfile_rotate 7

# ------------------------------------------------------------
# Erros personalizados
# ------------------------------------------------------------
error_directory /usr/share/squid/errors/pt-br
deny_info ERR_ACCESS_DENIED all
error_default_language pt-br

# ------------------------------------------------------------
# DNS — gerado por gwos-integrar:
#   BIND9 instalado (módulo 20) → 127.0.0.1, com RPZ
#   sem BIND9                   → resolvers externos
# ------------------------------------------------------------
include /etc/squid/conf.d/gwos_integracao.conf

# ------------------------------------------------------------
# Performance
# ------------------------------------------------------------
visible_hostname gateway.local
forwarded_for delete
via off
client_lifetime 1 day
half_closed_clients off
connect_timeout 30 seconds
peer_connect_timeout 10 seconds
read_timeout 5 minutes
request_timeout 5 minutes
